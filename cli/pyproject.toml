[project]
name = "kong-eyes"
version = "0.3.0"
description = "See what the guardrail on a Kong route is doing"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
koe = "kong_eyes.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kong_eyes"]
