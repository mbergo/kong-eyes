# Same traffic shape as chain.yaml, sent to a route where the input guardrail was left out on purpose.
suite: chain-gap
route: ai-chain-gap-route
path: /ai/chain-gap
guardrail: fixture-input-guard
stage: input
policy_version: chain-v1
environment: local
label_source: human
synthetic: true
cases:
  - case_id: gap-benign
    repeat: 5
    category: benign
    expected_action: allow
    violation: false
    messages: [{role: user, content: "Plain benign prompt. respond:CLEAN"}]
  - case_id: gap-violation-delivered
    repeat: 2
    category: violation
    expected_action: block
    violation: true
    messages: [{role: user, content: "This prompt contains [[VIOLATION]] and nothing here will stop it. respond:CLEAN"}]
