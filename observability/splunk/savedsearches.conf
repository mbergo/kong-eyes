# Alert templates for Splunk (savedsearches.conf). Disabled by default; set thresholds and a
# minimum sample size before enabling. Missing data never fires (searches return no rows).

[GO - confirmed slip (violation delivered)]
disabled = 1
cron_schedule = */15 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
search = index=main sourcetype="kong:guardrail:evaluation" event_type=adjudication synthetic=false \
| eval unit=run_id."|".case_id."|".trial."|".guardrail."|".stage | sort 0 - adjudication_revision | dedup unit \
| where 'delivery.outcome'="VIOLATION_DELIVERED" \
| stats count AS slips values(case_id) AS cases by environment route guardrail policy_version run_id \
| where slips >= 1
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
counttype = number of events
relation = greater than
quantity = 0

[GO - overcatch rate regression]
disabled = 1
cron_schedule = 0 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
# Requires at least MIN_SAMPLE benign units (FP+TN) and compares FPR against THRESHOLD; edit both.
search = index=main sourcetype="kong:guardrail:evaluation" event_type=adjudication synthetic=false \
| eval unit=run_id."|".case_id."|".trial."|".guardrail."|".stage | sort 0 - adjudication_revision | dedup unit \
| rename detector.outcome AS detector \
| stats count(eval(detector="FP")) AS FP count(eval(detector="TN")) AS TN latest(_time) AS last by environment route guardrail policy_version run_id \
| eval fp_den=FP+TN, FPR=if(fp_den=0,null(),FP/fp_den) \
| where fp_den >= 20 AND FPR > 0.10
alert.severity = 3
counttype = number of events
relation = greater than
quantity = 0

[GO - export or ingestion stall]
disabled = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
# Fires when runs were finalized but no kong_observation arrived in the window (telemetry gap), not when there is simply no traffic.
search = index=main sourcetype="kong:guardrail:evaluation" \
| stats count(eval(event_type="adjudication")) AS adj count(eval(event_type="kong_observation")) AS obs \
| where adj > 0 AND obs = 0
alert.severity = 3
counttype = number of events
relation = greater than
quantity = 0
