auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h
  # Only these low-cardinality resource attributes become index labels; everything
  # else (run_id, case_id, request_id...) stays as structured metadata / body.
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes: [service.name, event_type, environment, route, guardrail, stage, outcome, category, policy_version, synthetic]
    log_attributes:
      - action: structured_metadata
        attributes: [event_id, run_id, case_id, request_id, schema_version]
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
ruler:
  alertmanager_url: http://localhost:9093
analytics:
  reporting_enabled: false
